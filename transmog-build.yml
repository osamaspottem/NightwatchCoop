name: Transmog engine build
# Builds engine\out (bb-probe.exe and friends) for Windows with the Transmog tab, from this repository.
# Run it from the Actions tab ("Run workflow"); download the artifact when it finishes.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-miniupnpc

      - name: Build the engine
        shell: msys2 {0}
        run: |
          cd engine
          export CC=clang CXX=clang++
          BB_PGO=off bash build.sh || { tail -n 200 out/gpu-build.log || true; exit 1; }

      - name: Collect engine\out
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p artifact/engine/out
          cd engine/out
          for f in bb-probe.exe bb-shader-lab.exe bb-engine-assets.exe bb-gpu-capabilities.exe gpu-cache.id gpu-cache.legacy.id; do
            test -f "$f" && cp -f "$f" ../../artifact/engine/out/
          done
          for exe in bb-probe.exe bb-shader-lab.exe bb-engine-assets.exe bb-gpu-capabilities.exe; do
            test -f "$exe" || continue
            ldd "$exe" | awk '{print $3}' | grep -iE '/clang64/bin/.*\.dll$' | while read -r dll; do cp -f "$dll" ../../artifact/engine/out/; done
          done
          ls -l ../../artifact/engine/out

      - uses: actions/upload-artifact@v4
        with:
          name: nightwatch-transmog-engine
          path: artifact/
          if-no-files-found: error
